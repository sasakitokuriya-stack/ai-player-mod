name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-player-mod/ai-player-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ai-player-mod
          path: ai-player-mod/ai-player-mod/build/libs/ai-player-1.0.0.jar
